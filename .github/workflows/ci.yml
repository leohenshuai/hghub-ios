name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Tests (typecheck, node unit tests, hpp cargo tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本由 package.json 的 packageManager 字段统一指定，
      # 这里不能再写 version，否则 action-setup 会因两个版本来源报错。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 与 package.json 的 build 脚本保持一致的类型检查部分（不含 vite build）
      - name: 类型检查
        run: |
          pnpm exec tsc --noEmit
          pnpm exec tsc --project tsconfig.tests.json

      # 只跑可独立运行的 node 单元测试；scripts/test-plugins.mjs 是
      # Windows + Edge + dev_host 的集成测试，不在 ubuntu CI 里跑。
      - name: Node 单元测试
        run: |
          node scripts/test-app-updates.mjs
          node scripts/test-next-episode.mjs
          node scripts/test-playback-state.mjs
          node scripts/test-media-capabilities.mjs

      # 工具链版本与 Cargo.toml 的 rust-version = "1.90" 对齐，不再用浮动 stable
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/crates/hpp -> target
          key: ci-hpp-test

      - name: hpp crate 测试
        run: cargo test --manifest-path src-tauri/crates/hpp/Cargo.toml
