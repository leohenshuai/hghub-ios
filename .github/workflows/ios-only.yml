name: iOS Unsigned
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则用 package.json 的 version，它是唯一源头）"
        required: false
        default: ""
permissions:
  contents: write
env:
  CI: "true"
jobs:
  ios:
    name: iOS Build (IPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Team ID 只维护在 tauri.conf.json 的 bundle.iOS.developmentTeam，workflow 从那里读
      - name: 读取 Team ID
        id: team
        shell: bash
        run: echo "team=$(node -p "require('./src-tauri/tauri.conf.json').bundle.iOS.developmentTeam")" >> "$GITHUB_OUTPUT"

      # 版本号唯一源头是 package.json；填写了 input 才覆盖，并同步到所有位置
      - name: 对齐版本号
        id: ver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          V="${V#v}"
          if [ -z "$V" ]; then
            V=$(node -p "require('./package.json').version")
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "GITHUB_REF_NAME=v$V" >> "$GITHUB_ENV"
          echo "APP_REF=v$V" >> "$GITHUB_ENV"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"
          node -e "const fs=require('fs');const p='src-tauri/Cargo.toml';const s=fs.readFileSync(p,'utf8');fs.writeFileSync(p,s.replace(/^version = \".*\"$/m,'version = \"'+process.argv[1]+'\"'))" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios-build

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 初始化 iOS Xcode 工程
        run: |
          pnpm tauri ios init --ci
          # 确保 iOS Info.plist（含 ~iphone / ~ipad 变体）支持横竖屏切换及 ATS
          for plist in $(find src-tauri/gen/apple -name "Info.plist" 2>/dev/null); do
            for key in "UISupportedInterfaceOrientations" "UISupportedInterfaceOrientations~iphone" "UISupportedInterfaceOrientations~ipad"; do
              /usr/libexec/PlistBuddy -c "Delete :${key}" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :${key} array" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:0 string UIInterfaceOrientationPortrait" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:1 string UIInterfaceOrientationLandscapeLeft" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:2 string UIInterfaceOrientationLandscapeRight" "$plist"
            done
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$plist"
          done
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ steps.team.outputs.team }}

      - name: 构建 iOS 应用与打包 IPA
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
          APPLE_DEVELOPMENT_TEAM: ${{ steps.team.outputs.team }}
        run: bash scripts/build-ios-unsigned.sh "$APP_VERSION"

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: artifacts/*
          if-no-files-found: error

      - name: 发布 IPA 到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="ios-v${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "HGhub iOS ${{ steps.ver.outputs.version }} (unsigned)" \
              --notes "Unsigned IPA built by the iOS Unsigned workflow. Re-sign with TrollStore / AltStore / Sideloadly before installing."
          fi

